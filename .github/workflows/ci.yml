name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build · deploy to local replica · test · upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dfinity/setup-dfx@main
        with:
          dfx-version: "0.27.0"

      - name: Type-check and compile
        run: dfx build --check

      - name: Integration test against a local replica (incl. upgrade)
        run: KEEP_REPLICA=1 ./scripts/test.sh

      - name: Committed Candid interface matches the code
        run: |
          # dfx derives the .did from main.mo; the copy in src/ is what reviewers
          # read, so the two must be byte-identical.
          diff .dfx/local/canisters/Calculator/Calculator.did src/calculator.did

      - name: Stop replica
        if: always()
        run: dfx stop || true
